<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Artist Freeland</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #color-palette {
            display: grid;
            /* 7 Columns of colors */
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        .color-swatch {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-swatch.selected {
            border: 2px solid #000;
            transform: scale(1.1);
            z-index: 2;
        }
        #item-library {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        #item-library img {
            width: 100%;
            height: auto;
            object-fit: contain;
            cursor: pointer;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Sidebar Controls -->
        <div id="sidebar">
            <h2>🎨 Canvas Tools</h2>
            
            <div class="control-group">
                <h3>Canvas Tools</h3>
                <label>Tool Mode:</label>
                <select id="tool-mode">
                    <option value="draw-partition">Freehand Drawing</option>
                    <option value="fill-section">Fill Section Color</option>
                </select>
                <br><br>
                
                <label style="margin-top: 10px; display: block;">Line Thickness:</label>
                <input type="range" id="line-thickness" min="0.5" max="30" step="0.5" value="0.5">
                <br>
                
                <label>Pick Color:</label>
                <div id="color-palette">
                    <!-- Palettes will be generated by JS -->
                </div>
                
                <div style="display: flex; gap: 5px; margin-top: 12px;">
                    <button id="undo-btn">↩️ Undo</button>
                    <button id="redo-btn">↪️ Redo</button>
                </div>
                
                <!-- Composition Helper Guide -->
                <div style="margin-top: 15px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="grid-toggle" style="width: auto; margin: 0;">
                    <label for="grid-toggle" style="cursor: pointer; font-size: 1.05rem;">Show Grids</label>
                </div>

                <button id="clear-items-btn" style="background-color: #a67c52; margin-top: 15px;">🗑️ Clear Items Only</button>
                <button id="clear-canvas" class="btn-danger">Reset Everything</button>
            </div>

            <div class="control-group">
                <h3>Pre-loaded artwork items</h3>
                <p class="hint">Tap an item to place it, then choose it on canvas to edit properties.</p>
                <div id="item-library">
                    <!-- Images automatically populate here -->
                </div>
            </div>
            
            <!-- Item Customization Panel Engine -->
            <div id="resize-control-box" class="control-group hidden">
                <h3>Adjust Selected Item</h3>
                
                <label>Size:</label>
                <input type="range" id="size-slider" min="30" max="400" value="150">
                
                <label style="margin-top: 10px; display: block;">Rotate Angle:</label>
                <input type="range" id="rotate-slider" min="0" max="360" value="0">
                
                <label style="margin-top: 10px; display: block;">Opacity (Transparency):</label>
                <input type="range" id="opacity-slider" min="10" max="100" value="100">
                
                <button id="mirror-btn" style="margin-top: 15px;">↔️ Mirror Flip</button>
                
                <!-- Arrangement Layers Shifter -->
                <div style="display: flex; gap: 5px; margin-top: 8px;">
                    <button id="layer-up-btn" style="background-color: #51685c;">🔼 Bring Forward</button>
                    <button id="layer-down-btn" style="background-color: #51685c;">🔽 Send Backward</button>
                </div>
                
                <button id="delete-item" class="btn-danger">Remove Item</button>
            </div>

            <div class="control-group">
                <h3>Export Artwork</h3>
                <button id="save-email-btn" style="background-color: #51685c;">💾 Save & Email PNG</button>
            </div>
        </div>

        <!-- Dynamic canvas area -->
        <div id="canvas-area">
            <div id="canvas-wrapper">
                <canvas id="bg-canvas"></canvas>
                <div id="art-canvas"></div>
                
                <div id="grid-overlay" class="hidden">
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
